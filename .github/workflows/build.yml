name: Gerar APK

on:
  push:
    branches: [main]
    tags: ["v*"]          # marcar uma versão (ex.: v1.1.0) publica em Releases
  release:
    types: [published]    # release criada pelo site também recebe o APK
  workflow_dispatch:

permissions:
  contents: write         # necessário para criar a Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VELAR_VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.VELAR_KEYSTORE_BASE64 }}
      VELAR_KEYSTORE_PASSWORD: ${{ secrets.VELAR_KEYSTORE_PASSWORD }}
      VELAR_KEY_ALIAS: ${{ secrets.VELAR_KEY_ALIAS }}
      VELAR_KEY_PASSWORD: ${{ secrets.VELAR_KEY_PASSWORD }}
      # Impressão digital do arquivo velar.jks (não é segredo): confirma que a chave chegou inteira.
      EXPECTED_JKS_SHA256: 4b49e1b3cee44e1dd9742ef8bd9e372854d4ca94cdae4f194b2075c739c8ddb7

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Definir versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versão: da tag (v1.2.0) ou do arquivo version.txt na branch main.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
            PUBLISH=1
          else
            NAME="$(tr -d '[:space:]' < version.txt)"
            # Na main, publica só se essa versão ainda não tem Release.
            if gh release view "v$NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then PUBLISH=0; else PUBLISH=1; fi
            [ "$GITHUB_REF" = "refs/heads/main" ] || PUBLISH=0
          fi
          echo "Versão $NAME (publicar em Releases: $PUBLISH)"
          echo "VELAR_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$NAME" >> "$GITHUB_ENV"
          echo "PUBLISH=$PUBLISH" >> "$GITHUB_ENV"

      - name: Preparar chave de assinatura (opcional)
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/velar.jks" || {
            echo "::error::VELAR_KEYSTORE_BASE64 inválido: cole o conteúdo inteiro do arquivo velar.jks.b64."; exit 1; }
          B64_LEN=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | wc -c)
          JKS_SHA=$(sha256sum "$RUNNER_TEMP/velar.jks" | cut -d' ' -f1)
          if [ "$JKS_SHA" != "$EXPECTED_JKS_SHA256" ]; then
            echo "::error::VELAR_KEYSTORE_BASE64 chegou diferente do arquivo velar.jks.b64 ($B64_LEN de 3508 caracteres). Recadastre colando o conteúdo inteiro."
            exit 1
          fi
          echo "Arquivo da chave confere ($B64_LEN caracteres)."
          PASS="$(printf '%s' "$VELAR_KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          echo "Senha recebida com ${#PASS} caracteres (esperado: 24)."
          if ! keytool -list -keystore "$RUNNER_TEMP/velar.jks" -storepass "$PASS" > /dev/null 2>&1; then
            echo "::error::A senha em VELAR_KEYSTORE_PASSWORD não abre a chave. Recadastre esse secret copiando a senha do SECRETS-GITHUB.txt."
            exit 1
          fi
          echo "Chave de assinatura conferida."
          echo "VELAR_KEYSTORE_PATH=$RUNNER_TEMP/velar.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Conferir assinatura do APK
        if: env.VELAR_KEYSTORE_PATH != ''
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          # Impressão digital pública do certificado Velar DNS (SHA-256).
          EXPECTED="1e72283cfd1138b4131b80222757768928755065dafb962918c34abe263c769c"
          ACTUAL=$(unzip -p "$APK" 'META-INF/*.RSA' 2>/dev/null | keytool -printcert 2>/dev/null | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f')
          if [ -z "$ACTUAL" ]; then
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
            ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 | grep -i "SHA-256 digest" | head -1 | sed 's/.*: *//')
          fi
          echo "Certificado do APK: ${ACTUAL:-não encontrado}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::O APK não saiu assinado com a chave do Velar DNS."
            exit 1
          fi
          echo "APK assinado com a chave do Velar DNS."

      - name: Renomear APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/velar-dns-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: velar-dns-apk
          path: dist/*.apk

      - name: Publicar em Releases
        # Só publica APK assinado com a chave fixa.
        if: env.PUBLISH == '1' && env.VELAR_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nome fixo: o link .../releases/latest/download/velar-dns.apk sempre aponta para a versão mais nova.
          cp app/build/outputs/apk/release/*.apk dist/velar-dns.apk
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Release já criada pelo site: só anexa (ou substitui) o APK.
            gh release upload "$RELEASE_TAG" dist/velar-dns.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/velar-dns.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Velar DNS $RELEASE_TAG" \
              --notes-file NOVIDADES.md
          fi
          echo "Publicado: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
