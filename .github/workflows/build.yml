name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.VELAR_KEYSTORE_BASE64 }}
      VELAR_KEYSTORE_PASSWORD: ${{ secrets.VELAR_KEYSTORE_PASSWORD }}
      VELAR_KEY_ALIAS: ${{ secrets.VELAR_KEY_ALIAS }}
      VELAR_KEY_PASSWORD: ${{ secrets.VELAR_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar chave de assinatura (opcional)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/velar.jks"
          echo "VELAR_KEYSTORE_PATH=$RUNNER_TEMP/velar.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/velar-dns-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: velar-dns-apk
          path: dist/*.apk
